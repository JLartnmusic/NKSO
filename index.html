<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후원 계좌 안내 · New Korean Symphony Orchestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #17222E;
    --navy-deep: #0E161F;
    --ivory: #F4EFE2;
    --gold: #A9822F;
    --gold-light: #C9A75C;
    --burgundy: #6E2A38;
    --line: rgba(244, 239, 226, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 50% -10%, #24384A 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--ivory);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .program {
    width: 100%;
    max-width: 460px;
    position: relative;
  }

  .program::before,
  .program::after {
    content: "";
    display: block;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  .frame {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 56px 40px 48px;
    text-align: center;
  }

  .kicker {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 27px;
    line-height: 1.45;
    color: var(--ivory);
    letter-spacing: -0.01em;
  }

  .divider {
    width: 44px;
    height: 1px;
    background: var(--gold);
    margin: 26px auto;
  }

  .purpose {
    font-size: 14.5px;
    line-height: 1.9;
    color: rgba(244, 239, 226, 0.72);
    max-width: 320px;
    margin: 0 auto 40px;
  }

  .details {
    text-align: left;
    border: 1px solid var(--line);
    padding: 26px 28px;
    position: relative;
  }

  .details::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 14px; height: 14px;
    border-top: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
  }

  .details::after {
    content: "";
    position: absolute;
    bottom: -1px; right: -1px;
    width: 14px; height: 14px;
    border-bottom: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field + .field {
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  .label {
    font-size: 12.5px;
    color: var(--gold-light);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .value {
    font-family: 'Noto Serif KR', serif;
    font-size: 16.5px;
    color: var(--ivory);
    line-height: 1.5;
    word-break: keep-all;
  }

  .value.number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .copy-btn {
    margin-top: 4px;
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--gold-light);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  .copy-btn:hover {
    border-bottom-color: var(--gold-light);
  }

  .copy-btn.copied {
    color: var(--ivory);
  }

  footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(244, 239, 226, 0.4);
  }

  @media (max-width: 480px) {
    .frame { padding: 44px 26px 36px; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>

  <div class="program">
    <div class="frame">
      <p class="kicker">Charitable Giving</p>
      <h1>뉴코리안심포니오케스트라<br>후원 계좌 안내</h1>
      <div class="divider"></div>
      <p class="purpose">아래 계좌 정보를 확인하여 후원해 주시기 바랍니다.</p>

      <div class="details">
        <div class="field">
          <span class="label">예금주 Account Name</span>
          <span class="value">NEW KOREAN SYMPHONY ORCHESTRA CHARITABLE</span>
        </div>
        <div class="field">
          <span class="label">계좌번호 Account Number</span>
          <span class="value number">06-0273-0767207-00</span>
          <button class="copy-btn" id="copyBtn">계좌번호 복사</button>
        </div>
      </div>
    </div>

    <footer>NEW KOREAN SYMPHONY ORCHESTRA</footer>
  </div>

  <script>
    const btn = document.getElementById('copyBtn');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('06-0273-0767207-00');
        btn.textContent = '복사됨';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '계좌번호 복사';
          btn.classList.remove('copied');
        }, 1800);
      } catch (e) {
        btn.textContent = '복사 실패';
      }
    });
  </script>

</body>
</html>
